name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DeterminFlow
    steps:
      - uses: actions/checkout@v4
        with:
          path: DeterminFlow
      - name: Check out paired plugins for integration tests
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/{1}', github.repository_owner, github.event.repository.name == 'xs2' && 'xs2-plugins' || 'DeterminFlow-Plugins') }}
          path: DeterminFlow-Plugins
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DeterminFlow/requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        run: npm test
      - name: Test novel plugin UI
        working-directory: web
        run: npx tsx --tsconfig tsconfig.test.json --test src/lib/novel*.test.ts src/components/CharacterVoiceEditor.test.ts src/components/NovelResourceGate.test.ts
      - working-directory: web
        run: npm run build

  container-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
